    <radialGradient id="glow" cx="50%" cy="38%" r="60%">
      <stop offset="0" stop-color="#2a2433"/>
      <stop offset="1" stop-color="#12111a"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#glow)"/>
  <g fill="none" stroke="#3cc3c8" stroke-width="4.6" stroke-linejoin="round">
    <rect x="17" y="17" width="30" height="30"/>
    <rect x="17" y="17" width="30" height="30" transform="rotate(45 32 32)"/>
  </g>
  <circle cx="32" cy="32" r="6.2" fill="#f2b53a"/>
</svg>
