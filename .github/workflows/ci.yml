name: CI

# Every push and pull request: type-check and build the production bundle.
on:
  push:
    branches: [master, develop, "feature/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Type-check
        run: yarn typecheck

      - name: Build
        run: yarn build

      - name: Bundle size report
        if: always()
        run: |
          echo "### Bundle" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          du -h build/assets/*.js | sort -h | tail -n 12 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # Only after the build passed, only for master, only when the deploy key is set.
  # The key can run nothing on the server except the BookOn deploy scripts.
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH (checked, rolls back on failure)
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ]; then echo "DEPLOY_SSH_KEY secret is not set - skipping deploy"; exit 0; fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          # pinned host key of the production server
          echo "187.77.130.31 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMvfA9y/YnLp6Q2tu2fTr/Eo7ygYWdHLa2xGoZJPp/fs" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes root@187.77.130.31 frontend

      - name: Check the live site
        run: |
          for i in $(seq 1 10); do
            if curl -fsS https://bookon.sale/ | grep -q '<div id="root">'; then echo "site is up"; exit 0; fi
            sleep 3
          done
          exit 1
